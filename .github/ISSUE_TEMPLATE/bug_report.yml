name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A minimal reproduction is the fastest way to a fix: the
        [live demo](https://faraasat.github.io/react-advanced-texteditor-md/) is a good place to start, and a StackBlitz or a
        small repository is even better.

        **Does the problem also happen with the core editor?** If it does not involve React (the editor's behaviour, the
        Markdown it stores, a plugin, the toolbar), it belongs in
        [advanced-texteditor-md](https://github.com/faraasat/advanced-texteditor-md/issues).

        **Security problem?** Do not file it here. Use a [private advisory](https://github.com/faraasat/react-advanced-texteditor-md/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Package versions
      description: Output of `npm ls react-advanced-texteditor-md advanced-texteditor-md react`.
      placeholder: "react-advanced-texteditor-md 0.1.0, advanced-texteditor-md 0.1.0, react 19.3.0"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Next.js App Router
        - Next.js Pages Router
        - Vite
        - Remix / React Router
        - Create React App or other webpack setup
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options:
        - Chrome / Chromium / Edge
        - Firefox
        - Safari / WebKit
        - Android browser
        - iOS browser
        - Not browser-related (server rendering, build)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "e.g. Firefox 140, Safari 18.5"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15, Windows 11, Ubuntu 24.04, iOS 18"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version and package manager
      placeholder: "e.g. Node 22, npm 10"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps, or a link to a repository, StackBlitz or CodeSandbox. Include the props you pass to `<MarkdownEditor />`.
      placeholder: |
        1. Render <MarkdownEditor value={md} onChange={setMd} />
        2. Type "..."
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console or build output
      description: Errors or warnings from the browser console, the server or the build (hydration warnings included).
      render: shell
